<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI catalogue — {{DIR}}</title>
<!-- Generated by `ui scan`; never edit. The app's own css, in cascade order: -->
{{LINKS}}<style>
@layer catalogue {
  .cat-bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center;
    padding: .6rem 1rem; background: var(--surface-2, Canvas); color: var(--ink, CanvasText);
    border-bottom: 1px solid var(--line, GrayText); font: 500 .85rem/1.3 system-ui, sans-serif; }
  .cat-bar strong { margin-inline-end: auto; }
  .cat-bar label { display: inline-flex; gap: .35rem; align-items: center; }
  .cat-list { display: grid; gap: 2rem; padding: 1rem; }
  .cat-head { font: .8rem/1.4 ui-monospace, monospace; color: var(--ink-muted, GrayText); margin-block-end: .5rem; }
  .cat-head h2 { font: 600 1rem/1.2 system-ui, sans-serif; color: var(--ink, CanvasText); margin: 0 0 .15rem; }
  .cat-head p { margin: 0 0 .3rem; }
  .cat-head dl { display: grid; grid-template-columns: max-content 1fr; gap: 0 .6rem; margin: 0; }
  .cat-head dd { margin: 0; }
  .cat-head code { white-space: nowrap; font: inherit; }
  .cat-stage { container-type: inline-size; padding: 1rem; border: 1px dashed var(--line, GrayText); border-radius: .5rem;
    background: var(--surface, Canvas); overflow-x: auto; }
  .cat-stage[data-overflow] { outline: 2px solid var(--danger, red); }
  .cat-empty { font: italic .9rem system-ui, sans-serif; color: var(--ink-muted, GrayText); }
}
body { margin: 0; background: var(--surface, Canvas); color: var(--ink, CanvasText); }
</style>
</head>
<body>
<nav class="cat-bar" aria-label="catalogue controls">
  <strong>{{DIR}} · {{COUNT}} components</strong>
  <label>theme <select id="cat-theme"><option>light</option><option>dark</option></select></label>
  <label>palette <select id="cat-palette"><option value="">default</option>{{PALETTES}}</select></label>
  <label>density <select id="cat-density"><option value="">default</option><option>compact</option><option>comfortable</option></select></label>
</nav>
<main class="cat-list">
{{STAGES}}</main>
<script>
(() => {
  const root = document.documentElement;
  const q = new URLSearchParams(location.hash.slice(1));
  const set = (k, v) => { if (v) root.dataset[k] = v; else delete root.dataset[k]; };
  for (const k of ["theme", "palette", "density"]) {
    const el = document.getElementById("cat-" + k);
    const v = q.get(k) || (k === "theme" && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "") || (k === "theme" ? "light" : "");
    set(k, v); el.value = v;
    el.addEventListener("change", () => { set(k, el.value); q.set(k, el.value); history.replaceState(null, "", "#" + q); measure(); });
  }
  function measure() {
    const over = [];
    for (const s of document.querySelectorAll(".cat-stage")) {
      const o = s.scrollWidth > s.clientWidth + 1;
      s.toggleAttribute("data-overflow", o);
      if (o) over.push(s.dataset.component);
    }
    if (document.documentElement.scrollWidth > innerWidth + 1) over.push("(page)");
    root.dataset.overflow = over.join(" ");
  }
  addEventListener("load", measure);
  addEventListener("resize", measure);
})();
</script>
</body>
</html>
