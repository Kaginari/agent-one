# .agent-one/config.yaml — a full project file. The same document in JSON is example.json.
#
# The mounts live on the conduit proxy (litellm-docker.config.yaml :4000): glm-5-3-conduit,
# kimi-3-conduit, nemotron-3-super-120b-conduit. Every lane pinned two deep; no gemma.
models:
  default: litellm/glm-5-3-conduit             # the mount: the human's choice, never routed
  roles:                                      # the subagent triad; tiers must not descend
    analyst: litellm/nemotron-3-super-120b-conduit  # analyst:
    judge: litellm/kimi-3-conduit                    # judge:
    drafter: {model: litellm/kimi-3-conduit, effort: high, fallback: litellm/glm-5-3-conduit} # drafter:
  members:
    zone-changelog: litellm/nemotron-3-super-120b-conduit  # a genuinely mechanical zone
  tasks:
    log: litellm/nemotron-3-super-120b-conduit
    bench: vllm/meta-llama/Llama-3.1-70B-Instruct
smallModel: ollama/qwen2.5:7b

providers:
  litellm:
    type: openai
    baseURL: http://127.0.0.1:4000/v1
    apiKeyEnv: LITELLM_API_KEY
    timeout: 10m
    toolCalls: native
    contextWindow: auto                        # read from /v1/models max_model_len
    models:                                     # price: USD per 1M tokens; absent = unpriced
      nemotron-3-super-120b-conduit: {tier: 1, contextWindow: 131072, price: {input: 0.2, output: 1}}
      kimi-3-conduit: {tier: 2, contextWindow: 262144, price: {input: 1, output: 4}}
      glm-5-3-conduit: {tier: 3, contextWindow: 262144, price: {input: 2, output: 8}}
  ollama: {enabled: true}
  vllm:                                         # a hosted vLLM is an openai-compatible endpoint
    type: openai
    baseURL: http://gpu-box:8000/v1
    apiKeyEnv: VLLM_API_KEY                     # the key lives in the environment, never here
    headers: {X-Team: platform}
    timeout: 5m
    tls: {insecureSkipVerify: false, caFile: /etc/ssl/internal-ca.pem}
    toolCalls: native                           # needs --enable-auto-tool-choice on the server
    guidedDecoding: true
    contextWindow: auto                         # read from /v1/models max_model_len
    models:
      meta-llama/Llama-3.1-70B-Instruct: {tier: 2}

tools:
  profile: max
  bash: {timeout: 3m, sandbox: bwrap, envAllow: [GOFLAGS, PATH]}
  webfetch: {enabled: false}
  websearch: {class: outward}
  custom:
    lsl:                                        # an `ls` wrapper: argv, one element per placeholder
      description: long listing of one directory
      class: read
      params:
        path: {type: string, description: directory, required: true}
      run: [ls, -la, "{{path}}"]
    kget:                                       # `kubectl get` as a read tool
      description: kubectl get <kind> in a namespace
      class: read
      params:
        kind: {type: string, required: true, enum: [pods, svc, deploy]}
        ns: {type: string, default: default}
      run: [kubectl, get, "{{kind}}", -n, "{{ns}}", -o, wide]
      timeout: 30s
      sandbox: none
      profiles: [anthropic, openai]
  missing: {doomLoopRepeats: 2, proposeOnSecondNaming: true, liveReload: true}

policy:
  humanGate: {strict: false, approve: []}
  wire: {cap: 4096}
  budget: {steps: 60}

permissions:
  rules:
    - {match: "bash:git push*", action: allow}          # one outward pattern, pre-approved
    - {match: "bash:git push --force*", action: deny}   # more specific: deny wins
    - {match: "edit:**/*.lock", action: deny}
    - {match: "read:**/.env*", action: ask}

rules:
  - id: no-force
    text: |
      Never force-push a shared branch.
    scope: all
  - file: rules/zone-zone.md                           # relative to this file's directory
    scope: rank:zone
  - id: vet
    check: go vet ./...
    scope: all
    timeout: 60s

hooks:
  postTool:
    - {match: "write|edit", command: "gofmt -l -w \"$FILE\" >/dev/null 2>&1 || true"}

mcp:
  servers:
    files:                                      # a stdio server, sandboxed like bash
      type: stdio
      command: [npx, -y, "@modelcontextprotocol/server-filesystem", "."]
      env: {LOG_LEVEL: warn}
      envAllow: [PATH]
      network: false
      inward: true                              # never leaves the machine: class write at most
      tools:
        read_file: {class: read}
    docs:                                       # a remote streamable-http server
      type: http
      url: https://mcp.example.com/docs
      headersEnv: {Authorization: DOCS_MCP_TOKEN}   # header value from the env var, never inline
      timeout: 20s
      tools:
        search: {description: search the docs}

budgets:
  session: {tokens: 2000000, usd: 20}           # honest stop lines; 0 = off
  subagent: {tokens: 400000, usd: 4}
ui: {statusLine: true, announceSubagents: true}

ranks:
  # rank model pins are dead: the ladder routes member → role → task → default, so
  # ranks never pitch their own model — the role hat does (a rank's Role field says which).
  scribe:                                         # a new rank, added to the policy's table
    reportsTo: domain                                # an authoring rank needs a gate above it
    job: keeps the workspace's changelog
    authors: true
    role: drafter
    tools: [read, write, edit, git]

compaction:
  trigger: {tokens: 150000, fraction: 0.8}
  keepRecentTurns: 6

sessions: {keepDays: 90}
output: {format: text, thinking: false}
